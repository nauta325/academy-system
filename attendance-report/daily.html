<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>데일리 리포트</title>
<style>
  :root { --line:#e5e2da; --ink:#1f2328; --muted:#6b7280; --green:#1f7a70; --bg:#faf9f6;
    --late:#c98a2e; --absent:#cf6a4a; --ok:#1f7a70; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); background:#fff; display:flex;
    justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  h1 { margin:0; font-size:19px; }
  nav a { font-size:13px; color:var(--muted); text-decoration:none; margin-left:12px; }
  nav a:hover, nav a.on { color:var(--green); font-weight:700; }
  main { max-width:960px; margin:0 auto; padding:20px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  input, select, textarea, button { font-family:inherit; font-size:14px; }
  input[type=date], input[type=search] { padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
  .btn { padding:8px 14px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:#fff; }
  .btn.green { background:var(--green); color:#fff; border-color:var(--green); }
  .btn.coral { background:var(--absent); color:#fff; border-color:var(--absent); }
  .btn:disabled { opacity:.5; cursor:default; }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--absent); font-size:13px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .stuhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .nm { font-size:16px; font-weight:800; }
  .pill { font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; background:#f1f0ea; color:var(--muted); }
  .pill.late { background:#fbeee9; color:var(--late); }
  .pill.sent { background:#e7f0ee; color:var(--green); }
  .pill.unsent { background:#f1f0ea; color:var(--muted); }
  .savemsg { font-size:12px; margin-left:auto; }
  .savemsg.ok { color:var(--green); } .savemsg.saving { color:var(--muted); } .savemsg.err { color:var(--absent); }
  .prog { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; background:#fbfaf7; }
  .prow { display:grid; grid-template-columns:52px 1fr; gap:8px; align-items:center; margin:5px 0; }
  .prow .k { font-size:12px; font-weight:800; color:var(--muted); }
  .prow input { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; }
  .prev { grid-column:2; font-size:11.5px; color:var(--muted); margin-top:-2px; }
  /* 📜 최근 수업 — 운영 플래너와 같은 모양 */
  .hist{margin:6px 0 10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px;}
  .hist table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .hist th,.hist td{padding:4px 7px;border-bottom:1px solid #f1f1f1;text-align:left;vertical-align:top;}
  .hist th{background:#faf8f4;font-size:11px;color:#8a8f98;font-weight:700;}
  .hist td.d{white-space:nowrap;font-weight:700;width:68px;}
  .hist .same{color:#b5bac2;}
  .hist .bad{color:#c0392b;font-weight:700;} .hist .ok{color:#1c9a66;font-weight:700;}
  .hist .more{display:block;width:100%;border:0;background:#fafafa;padding:4px;font:inherit;
              font-size:11.5px;color:#6b7280;cursor:pointer;}
  .retest{background:#fde8e8;color:#b91c1c;border-radius:8px;padding:5px 9px;
          font-size:12.5px;font-weight:800;margin:4px 0;}
  .warn { grid-column:1/-1; font-size:11.5px; line-height:1.5; color:#8a5d0f; background:#fff8e6;
          border:1px solid #f0dca8; border-radius:7px; padding:6px 8px; margin:4px 0 2px; }
  .warn a { color:#7a500c; font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:8px 0; }
  @media(max-width:640px){ .grid{ grid-template-columns:1fr 1fr; } }
  .fld label { display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:3px; }
  .seg { display:flex; gap:4px; }
  .seg button { flex:1; padding:7px 0; border:1px solid var(--line); background:#fff; border-radius:7px; cursor:pointer; font-size:13px; }
  .seg button.on { background:var(--green); color:#fff; border-color:var(--green); }
  .fld input.score { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; }
  .note { margin:8px 0; }
  .note label { display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:3px; }
  .note textarea { width:100%; min-height:44px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; resize:vertical; }
  .note.parent textarea { border-color:#cfe0dc; background:#f7fbfa; }
  /* 발송 모달 */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-start; justify-content:center; padding:20px; overflow:auto; z-index:50; }
  .overlay.on { display:flex; }
  .modal { background:#fff; border-radius:14px; padding:20px; width:100%; max-width:640px; margin-top:20px; }
  .modal h2 { margin:0 0 4px; font-size:18px; }
  .srow { display:flex; gap:10px; padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; align-items:flex-start; }
  .srow.off { opacity:.5; }
  .srow input[type=checkbox] { width:18px; height:18px; margin-top:2px; accent-color:var(--green); }
  .srow .info { flex:1; font-size:13px; }
  .srow .info b { font-size:14px; }
  .srow .l2 { color:var(--muted); font-size:12px; line-height:1.6; margin-top:3px; }
  .modal .foot { display:flex; gap:8px; margin-top:14px; }
</style>
<script src="/config.js"></script>
</head>
<body>
<header>
  <h1><span data-academy></span> 📝 데일리 리포트 <span id="dateLabel" class="muted"></span></h1>
  <nav>
    <a href="/board.html">현황판</a><a href="/daily.html" class="on">데일리 리포트</a>
    <a href="/kiosk.html">키오스크</a><a href="/students.html">학생관리</a>
    <a href="/books.html">교재</a><a href="/report.html">월말평가서</a>
  </nav>
</header>
<main>
  <div class="bar">
    <input type="date" id="date" />
    <button class="btn" id="reload">🔄 새로고침</button>
    <input type="search" id="q" placeholder="🔍 학생 이름" oninput="render()" style="width:130px" />
    <select class="btn" id="addStu" style="display:none;max-width:170px"></select>
    <button class="btn" id="addBtn">➕ 보강 학생 추가</button>
    <button class="btn coral" id="send" style="margin-left:auto">📨 리포트 카톡 보내기</button>
  </div>
  <div class="muted" style="margin-bottom:12px">
    매일 새벽, 오늘 등원할 학생의 리포트가 <b>다음 진도까지 채워져 자동 생성</b>돼요. 바뀐 것만 고치면 됩니다 · 칸을 고치면 자동 저장 · 추가사항은 학부모 카톡에 나갑니다.<br>
    <b>결석 보강</b>(정규 수업일이 아닌 날 온 학생)은 <b>➕ 보강 학생 추가</b>로 그날 행을 만들면 진도가 다음으로 이어져요.
  </div>
  <div id="msg" class="err"></div>
  <div id="list"><div class="muted">날짜를 고르면 데일리 리포트가 열립니다.</div></div>
</main>

<!-- 발송 미리보기 모달 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>📨 데일리 리포트 발송</h2>
    <div class="muted" id="sendSub" style="margin-bottom:12px"></div>
    <div id="sendList"></div>
    <div class="foot">
      <button class="btn green" id="doSend">발송</button>
      <button class="btn" id="cancelSend">닫기</button>
    </div>
    <div id="sendResult" class="muted" style="margin-top:10px"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const SUBJECTS = ["문법", "리딩", "단어"];
let ROWS = [], TOC = {}, PREVIEW = [];

// ── 📜 최근 수업 ────────────────────────────────────────
// 운영 플래너(studyplanner `public/daily_report.html` 의 histHtml)를 그대로 옮긴 것.
// 시트처럼 위로 쭉: 날짜(요일) · 과목별 진도 · 단어 TEST · 태도/과제 · 지적.
//   · 3줄 먼저 보여주고 「더 보기」로 전부
//   · 직전(한 칸 아래)과 같은 진도는 흐리게 — 며칠째 그대로인지 바로 보임
//   · 값이 없으면 "-"
const WD = ["일","월","화","수","목","금","토"];
const HIST_OPEN = {};
function md(d){ return String(d||"").slice(0,10).slice(5).replace("-","/"); }
function wdOf(d){
  const t = new Date(String(d||"").slice(0,10) + "T00:00:00Z");
  return isNaN(t.getTime()) ? "" : WD[t.getUTCDay()];
}
function isFail(v){ return /불통과|미통과/.test(String(v||"")); }
function resTxt(res, score){
  if (!res && !score) return "";
  const cls = isFail(res) ? "bad" : (res ? "ok" : "");
  return `<span class="${cls}">${esc(res||"")}</span>${score ? " " + esc(score) : ""}`;
}

// 직전 수업이 단어 미통과였으면 「오늘 재시?」 를 묻는다 — 운영의 retestNote.
// 재시를 놓치면 그 학생은 같은 유닛에서 계속 멈춥니다.
function retestNote(r){
  const h = (r.recent || [])[0];
  if (!h || !isFail(h.voca_test)) return "";
  const unit = unitLabel((h.progress||{})["단어"]);
  return `<div class="retest">🔁 오늘 재시? — 지난 수업(${esc(md(h.date))}) 단어${unit ? " " + esc(unit) : ""} 미통과</div>`;
}

function histHtml(r, i){
  const H = r.recent || [];
  if (!H.length) return "";
  const subs = SUBJECTS.filter(sub => H.some(h => (h.progress||{})[sub]) || r.books[sub]);
  const n = HIST_OPEN[i] ? H.length : Math.min(3, H.length);
  const cell = (h, sub, idx) => {
    const v = unitLabel((h.progress||{})[sub]);
    if (!v) return '<td class="same">-</td>';
    const older = H[idx + 1];
    const same = older && unitLabel((older.progress||{})[sub]) === v;
    return `<td${same ? ' class="same"' : ""}>${esc(v)}</td>`;
  };
  const rows = H.slice(0, n).map((h, idx) => {
    const att = h.lateness && h.lateness !== "정시" && h.lateness !== "정시등원"
      ? ` <span class="bad">${esc(h.lateness)}</span>` : "";
    return `<tr><td class="d">${esc(md(h.date))} ${esc(wdOf(h.date))}${att}</td>`
      + subs.map(sub => cell(h, sub, idx)).join("")
      + `<td>${resTxt(h.voca_test, h.voca_score)}</td>`
      + `<td>${esc(h.attitude || "-")}</td><td>${esc(h.homework || "-")}</td>`
      + `<td style="color:#6b7280">${esc(h.note || "")}</td></tr>`;
  }).join("");
  const more = H.length > 3
    ? `<button class="more" onclick="HIST_OPEN[${i}]=!HIST_OPEN[${i}];render()">${HIST_OPEN[i] ? "▲ 접기" : `▼ 더 보기 (최근 ${H.length}번)`}</button>`
    : "";
  return `<div class="hist"><table><thead><tr><th>📜 최근 수업</th>`
    + subs.map(x => `<th>${esc(x)}</th>`).join("")
    + `<th>단어 TEST</th><th>태도</th><th>과제</th><th>지적</th></tr></thead><tbody>${rows}</tbody></table>${more}</div>`;
}

function esc(s){ return (s ?? "").toString().replace(/[&<>"]/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// 카톡 미리보기 — 과목별 교재·진도 한 줄. '-' 인 과목은 눈에 띄게 표시합니다.
// (1차 템플릿을 쓰시는데 여기가 '-' 면 학생DB 의 과목 키 이름이 템플릿 변수명과 다른 것)
function subjLine(vars){
  if (!vars) return "";
  const subj = [...new Set(Object.keys(vars).map(k => k.replace(/^#\{|교재\}$|진도\}$/g,"")).filter(Boolean))];
  if (!subj.length) return "";
  const parts = subj.map(s => {
    const b = vars[`#{${s}교재}`] || "-", p = vars[`#{${s}진도}`] || "-";
    const miss = (b === "-" && p === "-");
    return `<span style="${miss?"color:var(--absent)":""}">${esc(s)} ${esc(b)} ${esc(p)}</span>`;
  });
  const anyMiss = subj.some(s => (vars[`#{${s}교재}`]||"-") === "-" && (vars[`#{${s}진도}`]||"-") === "-");
  return `<div class="l2">📨 카톡에 들어갈 과목: ${parts.join(" · ")}`
    + (anyMiss ? ` <span style="color:var(--absent)">— '-' 인 과목은 학생DB의 과목 이름이 템플릿 변수명과 다른 것일 수 있어요</span>` : "")
    + `</div>`;
}
// 유닛 {code,title} 정규화 + 표시 라벨
function normU(u){ if(!u) return {code:"",title:""}; if(typeof u==="string") return {code:u,title:""}; return {code:u.code||"",title:u.title||""}; }
function unitLabel(u){ u=normU(u); return u.code + (u.title? " — "+u.title : ""); }

// 진도가 교재 목차와 연결됐는지 안내. 잘 돌아가면 아무것도 안 띄우고,
// **안 넘어가는 경우에만** 이유와 고치는 법을 보여준다 (사용자가 스스로 고치게).
function linkNote(row, sub){
  const L = (row.link||{})[sub];
  if (!L) return "";
  if (L.state === "no-toc")
    return `<div class="warn">📘 <b>${esc(L.book)}</b> 에 목차가 없어서 진도가 자동으로 안 넘어가요 · <a href="/books.html" target="_blank">목차 넣으러 가기 →</a></div>`;
  if (L.state === "unlinked")
    return `<div class="warn">⚠️ 지금 진도 <b>${esc(L.value)}</b> 가 <b>${esc(L.book)}</b> 목차에 없어서 <b>여기서 멈춥니다</b>. 위 칸에서 목차의 유닛을 <b>한 번만</b> 골라주면 다음부터 자동으로 넘어가요 · <a href="/books.html" target="_blank">목차 고치기</a></div>`;
  return "";
}
function kstToday(){ return new Date(Date.now()+9*3600*1000).toISOString().slice(0,10); }
// 주소에 ?date=·?teacher= 를 붙여 열 수 있다 (선생님앱이 담당 학생만 보이게 이렇게 연다)
const QS = new URLSearchParams(location.search);
const TEACHER = (QS.get("teacher") || "").trim();
const TQ = TEACHER ? "&teacher=" + encodeURIComponent(TEACHER) : "";
$("#date").value = /^\d{4}-\d{2}-\d{2}$/.test(QS.get("date") || "") ? QS.get("date") : kstToday();
if (TEACHER) document.title = TEACHER + " · " + document.title;

async function api(payload){
  const res = await fetch("/api/attendance", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) });
  const d = await res.json(); if (!res.ok) throw new Error(d.error || "실패"); return d;
}

async function loadToc(){
  try { const r = await fetch("/api/attendance?action=textbooks"); const d = await r.json();
    (d.textbooks||[]).forEach(t => { TOC[t.name] = (Array.isArray(t.units)? t.units : []).map(normU); });
  } catch(e){}
}

async function load(){
  $("#msg").textContent = ""; $("#list").innerHTML = '<div class="muted">불러오는 중…</div>';
  try {
    const r = await fetch("/api/attendance?action=daily-rows&date=" + $("#date").value + TQ);
    const d = await r.json(); if (!r.ok) throw new Error(d.error);
    $("#dateLabel").textContent = `${d.date} (${d.weekday})`;
    ROWS = d.rows || [];
    render();
  } catch(e){ $("#list").innerHTML = ""; $("#msg").textContent = e.message; }
}

function segHtml(i, field, opts, cur){
  return `<div class="seg" data-i="${i}" data-field="${field}">` + opts.map(o =>
    `<button data-v="${esc(o.v)}"${(cur??"")===o.v?' class="on"':""}>${esc(o.t)}</button>`).join("") + `</div>`;
}

function render(){
  const q = ($("#q").value||"").trim();
  const rows = ROWS.filter(r => !q || (r.name||"").indexOf(q) > -1);
  // 빈 화면일 때 "고장난 건지 비어 있는 건지" 를 구분해 줍니다.
  // 샘플 3명은 월·수·금(이서연은 월·화·목)만 수업이라 **토·일에는 아무도 안 뜹니다.**
  // 세미나가 주말에 열리면 전원이 빈 화면을 보게 되므로, 그 자리에서 해결책을 알려 줍니다.
  if (!rows.length){
    $("#list").innerHTML = '<div class="muted">'
      + '이 날짜에 <b>수업 예정인 학생이 없어요.</b> 고장난 게 아닙니다 — 그 요일에 등원하는 학생이 없는 거예요.<br><br>'
      + '· 내 학생을 넣으셨다면 → <a href="/students.html">학생 관리</a> 에서 <b>요일별 등원시간</b>을 채워주세요.<br>'
      + '· 아직 <b>샘플 3명</b>이라면 → 샘플은 평일만 수업이라 <b>주말에는 비어 보입니다.</b> '
      + 'Supabase <b>SQL Editor</b> 에서 <code>sql/test_1_today.sql</code> 을 Run 하면 '
      + '<b>샘플 3명이 오늘 수업하도록</b> 맞춰집니다.'
      + '</div>';
    return;
  }
  $("#list").innerHTML = rows.map(r => cardHtml(ROWS.indexOf(r))).join("");
}

function cardHtml(i){
  const r = ROWS[i], rec = r.record || {}, prev = r.prev;
  const late = rec.lateness === "지각" ? '<span class="pill late">지각</span>' : (rec.lateness==="결석" ? '<span class="pill late">결석</span>' : "");
  const sent = rec.report_sent === "전송" ? '<span class="pill sent">카톡 전송됨</span>' : '<span class="pill unsent">미전송</span>';
  const prog = SUBJECTS.map(sub => {
    const book = r.books[sub] || "";
    const cur = normU((rec.progress||{})[sub]);
    const units = TOC[book] || [];
    let field;
    if (units.length) {
      // 유닛을 목차에서 선택 → 코드+제목이 함께, 바꾸면 제목이 자동으로 바뀜
      const opts = units.map(u => `<option value="${esc(u.code)}"${u.code===cur.code?" selected":""}>${esc(unitLabel(u))}</option>`).join("");
      const custom = (cur.code && !units.some(u=>u.code===cur.code)) ? `<option value="${esc(cur.code)}" selected>${esc(unitLabel(cur))}</option>` : "";
      field = `<select data-i="${i}" data-sub="${sub}" data-book="${esc(book)}"><option value="">- 선택 -</option>${custom}${opts}</select>`;
    } else {
      field = `<input data-i="${i}" data-sub="${sub}" data-book="${esc(book)}" value="${esc(cur.code)}" placeholder="${esc(book||"교재 미지정")}">`;
    }
    // 지난 수업 3회를 한 줄로 — "요즘 계속 멈춰 있나" 가 바로 보입니다.
    // (예전엔 직전 1회만 보여줘서 흐름을 알 수 없었습니다)
    const hist = (r.recent||[]).filter(h => (h.progress||{})[sub]);
    const pv = hist.length
      ? `<div class="prev">↳ 지난 ${hist.map(h => `${esc(md(h.date))} ${esc(unitLabel(h.progress[sub]))}`).join("  ·  ")}</div>`
      : "";
    return `<div class="prow"><span class="k">${sub}</span>${field}</div>${pv}${linkNote(r, sub)}`;
  }).join("");
  return `<div class="card" data-i="${i}">
    <div class="stuhead">
      <span class="nm">${esc(r.name)}</span>
      ${r.record.check_in?`<span class="pill">🕒 등원 ${esc(r.record.check_in)}</span>`:(r.scheduled?`<span class="pill">예정 ${esc(r.scheduled)}</span>`:"")}
      ${late} ${sent}
      <button class="btn" style="padding:5px 10px;font-size:12px" onclick="sendOne(${i})">📨 이 학생</button>
      <span class="savemsg" id="save-${i}"></span>
    </div>
    ${retestNote(r)}${histHtml(r, i)}
    <div class="prog">${prog}</div>
    <div class="grid">
      <div class="fld"><label>지각/결석</label>${segHtml(i,"lateness",[{v:"정시",t:"정시"},{v:"지각",t:"지각"},{v:"결석",t:"결석"}],rec.lateness||"정시")}</div>
      <div class="fld"><label>태도</label>${segHtml(i,"attitude",[{v:"상",t:"상"},{v:"중",t:"중"},{v:"하",t:"하"}],rec.attitude||"상")}</div>
      <div class="fld"><label>과제</label>${segHtml(i,"homework",[{v:"상",t:"상"},{v:"중",t:"중"},{v:"하",t:"하"}],rec.homework||"상")}</div>
      <div class="fld"><label>단어테스트</label>${segHtml(i,"voca_test",[{v:"통과",t:"통과"},{v:"불통과",t:"불통과"},{v:"",t:"없음"}],rec.voca_test||"")}</div>
    </div>
    <div class="grid">
      <div class="fld"><label>단어테스트 점수</label><input class="score" data-i="${i}" data-field="voca_score" value="${esc(rec.voca_score||"")}" placeholder="예: 18/20"></div>
    </div>
    <div class="note parent"><label>추가사항 (학부모 카톡에 나가는 내용)</label><textarea data-i="${i}" data-field="parent_note">${esc(rec.parent_note||"")}</textarea></div>
    <div class="note"><label>지적사항 (내부 기록 — 학부모에게 안 나감)</label><textarea data-i="${i}" data-field="note">${esc(rec.note||"")}</textarea></div>
  </div>`;
}

// ── 세그먼트 클릭 ──
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".seg button"); if (!btn) return;
  const seg = btn.parentElement;
  seg.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  scheduleSave(Number(seg.dataset.i));
});
// ── 입력 변경 → 자동 저장 ──
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.i !== undefined && (el.dataset.sub || el.dataset.field)) scheduleSave(Number(el.dataset.i));
});

const timers = {};
function scheduleSave(i){
  const m = $("#save-"+i); if (m){ m.className="savemsg saving"; m.textContent="● 저장 중…"; }
  clearTimeout(timers[i]);
  timers[i] = setTimeout(()=>saveRow(i), 700);
}

function collect(i){
  const card = document.querySelector(`.card[data-i="${i}"]`);
  const progress = {};
  // select/input 모두 수용 → 코드로 목차에서 제목을 찾아 {code,title} 저장 (유닛 바꾸면 제목 자동)
  card.querySelectorAll("[data-sub]").forEach(el => {
    const code = (el.value||"").trim(); if (!code) return;
    const book = el.dataset.book || "";
    const hit = (TOC[book]||[]).map(normU).find(u => u.code === code);
    progress[el.dataset.sub] = { code, title: hit ? hit.title : "" };
  });
  const seg = (f) => { const on = card.querySelector(`.seg[data-field="${f}"] button.on`); return on ? on.dataset.v : null; };
  return {
    lateness: seg("lateness"), attitude: seg("attitude"), homework: seg("homework"),
    voca_test: seg("voca_test") || null,
    voca_score: card.querySelector('[data-field="voca_score"]').value.trim() || null,
    parent_note: card.querySelector('[data-field="parent_note"]').value,
    note: card.querySelector('[data-field="note"]').value,
    progress,
  };
}
async function saveRow(i){
  const r = ROWS[i]; const fields = collect(i);
  const m = $("#save-"+i);
  try {
    const d = await api({ action:"save-record", student_id:r.student_id, date:$("#date").value, fields });
    r.record = { ...r.record, ...d.record };
    if (m){ m.className="savemsg ok"; m.textContent="저장됨 ✓"; setTimeout(()=>{ if(m.textContent==="저장됨 ✓") m.textContent=""; }, 2000); }
  } catch(e){ if (m){ m.className="savemsg err"; m.textContent="저장 실패: "+e.message; } }
}

$("#reload").onclick = load;
$("#date").addEventListener("change", load);

// ── 보강 학생 추가 (정규 수업일 아닌 날 온 학생) ──
$("#addBtn").onclick = async () => {
  const sel = $("#addStu");
  if (sel.style.display === "none") {
    try {
      const res = await fetch("/api/attendance?action=students"); const d = await res.json();
      const inList = new Set(ROWS.map(r => r.student_id));
      const opts = (d.students||[]).filter(s => s.status === "재원" && !inList.has(s.id));
      if (!opts.length){ alert("추가할 학생이 없어요 (모두 이미 목록에 있음)."); return; }
      sel.innerHTML = `<option value="">보강 학생 선택…</option>` + opts.map(s => `<option value="${s.id}">${esc(s.name)}${s.grade?(" ("+esc(s.grade)+")"):""}</option>`).join("");
      sel.style.display = "";
    } catch(e){ alert(e.message); }
    return;
  }
};
$("#addStu").addEventListener("change", async (e) => {
  const id = e.target.value; if (!id) return;
  try {
    await api({ action:"add-row", student_id:id, date:$("#date").value });
    e.target.style.display = "none"; e.target.value = "";
    await load();
  } catch(err){ alert(err.message); }
});

// ── 발송 (미리보기 → 선택 → 발송) ──
async function openSend(studentIds){
  $("#sendResult").textContent = "";
  try {
    const d = await api({ action:"send-daily", date:$("#date").value, dryRun:true, student_ids:studentIds||null, teacher:TEACHER||undefined });
    PREVIEW = d.results || [];
    if (!PREVIEW.length){ alert("발송할 리포트가 없어요."); return; }
    // 1차(노션 알림톡) 템플릿을 쓰시면 카톡에 과목별 교재·진도 줄이 들어갑니다.
    // 그게 '-' 로 나가면 학생DB books/progress 의 **과목 키 이름**이 템플릿 변수명과 다른 것.
    // 보내기 전에 여기서 확인할 수 있게 미리보기에 같이 보여줍니다.
    $("#sendSub").textContent = `${d.date} — 대상 ${PREVIEW.length}명` + (d.solapi?"":" · ⚠️ 솔라피(TPL_DAILY) 미설정 상태라 실제 발송은 안 됩니다");
    $("#sendList").innerHTML = PREVIEW.map((p,idx) => {
      const dis = !p.ok && p.reason==="연락처 없음";
      const checked = p.ok && !p.already ? "checked" : (p.ok && p.already ? "" : "");
      return `<label class="srow${dis?" off":""}">
        <input type="checkbox" data-idx="${idx}" ${dis?"disabled":checked}>
        <div class="info"><b>${esc(p.name)}</b> ${p.already?'<span class="pill sent">이미 전송</span>':""} ${dis?'<span class="pill late">연락처 없음</span>':""}
          <div class="l2">진도: ${esc(p.progress||"-")} · 태도 ${esc(p.attitude)} · 과제 ${esc(p.homework)} · 단어 ${esc(p.voca)}${p.parent_note?` · 추가: ${esc(p.parent_note)}`:""}</div>
          <div class="l2">${p.phone?("학부모 "+esc(p.phone)):'<span style="color:var(--absent)">학부모 연락처 없음</span>'}</div>
          ${subjLine(p.vars)}
        </div></label>`;
    }).join("");
    $("#overlay").classList.add("on");
  } catch(e){ alert(e.message); }
}
$("#send").onclick = () => openSend(null);
function sendOne(i){ openSend([ROWS[i].student_id]); }
$("#cancelSend").onclick = () => $("#overlay").classList.remove("on");
$("#doSend").onclick = async () => {
  const ids = Array.from(document.querySelectorAll("#sendList input[type=checkbox]:checked")).map(c => PREVIEW[Number(c.dataset.idx)].student_id);
  if (!ids.length){ alert("보낼 학생을 선택하세요."); return; }
  const btn = $("#doSend"); btn.disabled = true; btn.textContent = "발송 중…";
  try {
    const d = await api({ action:"send-daily", date:$("#date").value, student_ids:ids, teacher:TEACHER||undefined });
    const fails = (d.results||[]).filter(x=>!x.ok);
    $("#sendResult").innerHTML = `발송 완료 — ${d.sent}/${d.total}건 성공` +
      (fails.length? "<br>실패: " + fails.map(f=>esc(f.name)+"("+esc(f.reason||"")+")").join(", ") : "") +
      (!d.solapi? "<br>⚠️ 솔라피 미설정으로 실제 발송은 되지 않았어요." : "");
    load();
  } catch(e){ $("#sendResult").textContent = "오류: " + e.message; }
  finally { btn.disabled = false; btn.textContent = "발송"; }
};

(async () => { await loadToc(); load(); })();
</script>
