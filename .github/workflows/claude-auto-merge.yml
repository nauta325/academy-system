# 클로드가 고친 것을 **자동으로 내 사이트에 반영**합니다.
#
# 왜 있나: 클로드 코드는 고친 내용을 `claude/…` 라는 가지(branch)에만 올려둡니다.
#   그대로 두면 내 주소는 하나도 안 바뀌어서, 「고쳤다는데 왜 그대로죠?」 가
#   제일 많이 나오는 질문이었습니다. 예전에는 **Create PR → Merge** 를 손으로
#   두 번 눌러야 했는데, 이 파일이 그걸 대신 눌러줍니다.
#
# 무슨 일이 벌어지나:
#   클로드가 가지에 올림  →  (이 파일) 기본 가지에 합침  →  Vercel 이 다시 배포
#   1~2분 뒤 내 주소를 새로고침하면 바뀌어 있습니다.
#
# ⚠️ 대신 **검토 단계가 없어집니다.** 클로드가 고친 게 바로 내 사이트에 올라갑니다.
#   되돌리고 싶으면 Vercel 의 Deployments 에서 이전 배포를 **Promote to Production**
#   하면 즉시 돌아갑니다 (코드는 깃허브에 그대로 남아 있습니다).
#
# 🔕 자동 반영을 끄고 싶으면 **이 파일을 지우세요.** 그러면 예전처럼
#   클로드 화면에서 Create PR → Merge 를 손으로 누르면 됩니다.

name: 클로드가 고친 것 자동 반영

on:
  push:
    branches:
      - "claude/**"       # 클로드 코드가 만드는 가지 이름

permissions:
  contents: write         # 기본 가지에 합치려면 필요합니다

concurrency:
  # 연달아 시키면 뒤엣것이 앞엣것을 기다립니다 (동시에 합치다 꼬이지 않게)
  group: claude-auto-merge
  cancel-in-progress: false

jobs:
  # ⚠️ job 이름(여기 id)은 **영문**이어야 합니다 — 한글로 쓰면 GitHub 이 파일을 거절합니다.
  merge:
    name: 기본 가지에 합치기
    runs-on: ubuntu-latest
    steps:
      - name: 합치기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
          HEAD: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          echo "«$HEAD» 를 «$BASE» 에 합칩니다."
          # GitHub 에 그대로 맡깁니다 — 빨리감기면 빨리감기로, 아니면 합침 커밋으로.
          #   합칠 게 없으면 204(성공, 빈 응답), 충돌이면 409 가 옵니다.
          if OUT=$(gh api -X POST "repos/$REPO/merges" \
                     -f base="$BASE" -f head="$HEAD" \
                     -f commit_message="클로드가 고친 것 ($HEAD)" 2>&1); then
            echo "✅ 합쳤습니다. Vercel 이 1~2분 안에 다시 배포합니다."
            echo "   내 주소를 새로고침해 보세요."
          elif echo "$OUT" | grep -qi "merge conflict"; then
            echo "::warning::같은 곳을 두 군데서 고쳐서 자동으로 못 합쳤습니다(충돌)."
            echo "클로드에게 «$BASE 최신 내용으로 rebase 해줘» 라고 말한 뒤 다시 시켜보세요."
            echo "또는 깃허브에서 Pull request 를 손으로 만들어 합치시면 됩니다."
          else
            echo "::warning::합치지 못했습니다."
            echo "$OUT"
            echo "깃허브 저장소 화면 위쪽의 «Compare & pull request» 로 손으로 합쳐주세요."
          fi
